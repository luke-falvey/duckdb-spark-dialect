name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_VERSION: v2.0.0
  PYSPARK_VERSION: "3.5.*"

jobs:
  build:
    name: Build the extension
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out DuckDB ${{ env.DUCKDB_VERSION }}
        run: git clone --depth 1 --branch "$DUCKDB_VERSION" https://github.com/duckdb/duckdb.git duckdb

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.DUCKDB_VERSION }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ env.DUCKDB_VERSION }}-

      - name: Configure
        # Only the loadable extension and the DuckDB core it needs are built (no shell, no unit tests).
        # OVERRIDE_GIT_DESCRIBE stamps the extension with the exact release version, matching the
        # duckdb==2.0.0 Python package it is loaded into below.
        run: |
          cmake -G Ninja -S duckdb -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHELL=OFF -DBUILD_UNITTESTS=OFF -DENABLE_SANITIZER=FALSE \
            -DOVERRIDE_GIT_DESCRIBE="$DUCKDB_VERSION" \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/extension_config.cmake" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the extension
        env:
          CCACHE_MAXSIZE: 2G
        run: |
          ccache --zero-stats
          cmake --build build --target spark_dialect_loadable_extension
          ccache --show-stats

      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: spark_dialect-${{ env.DUCKDB_VERSION }}-linux_amd64
          path: build/extension/spark_dialect/spark_dialect.duckdb_extension

  unit:
    name: Harness unit tests and settings inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install "duckdb==${DUCKDB_VERSION#v}" pandas pytz pytest

      - name: Harness unit tests
        run: python -m pytest -q test/test_harness.py

      - name: Settings inventory (plan B1)
        run: python test/settings/check_inventory.py

      - name: Generated case files are up to date
        run: |
          python scripts/gen_setting_cases.py
          python scripts/gen_type_cases.py
          python scripts/gen_composition_cases.py
          python scripts/gen_from_shape_cases.py
          python scripts/gen_type_name_cases.py
          python test/fuzz/args_sweep.py --types --emit
          git diff --exit-code -- test/cases
          python scripts/gen_arg_type_rules.py --check

  golden:
    name: Record expected results with Spark 3.5 (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [base, settings, types-casts, types-operators, types-common, types-args, types-compose, types-rest, corpus]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (for Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python packages
        run: pip install "pyspark==$PYSPARK_VERSION" pandas pytz

      - name: Record expected results with Apache Spark
        # Re-runs every case in Spark so the comparison is against a live Spark 3.5,
        # not only the results committed in test/golden/. Done once per group; both dialects compare against it.
        run: python test/make_golden.py $(python scripts/case_group.py ${{ matrix.group }})

      - name: Record the files that run again with ANSI mode on (workstream D)
        run: |
          files=$(python scripts/case_group.py ${{ matrix.group }} --config ansi)
          if [ -n "$files" ]; then python test/make_golden.py --config spark.sql.ansi.enabled=true $files; fi

      - name: Upload the expected results
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.group }}
          path: test/golden/

  test:
    name: Compare DuckDB (${{ matrix.dialect }}, ${{ matrix.group }}) with Spark
    needs: [build, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dialect: [spark, spark_strict]
        group: [base, settings, types-casts, types-operators, types-common, types-args, types-compose, types-rest, corpus]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download the extension
        uses: actions/download-artifact@v4
        with:
          name: spark_dialect-${{ env.DUCKDB_VERSION }}-linux_amd64
          path: build

      - name: Download the expected results
        uses: actions/download-artifact@v4
        with:
          name: golden-${{ matrix.group }}
          path: test/golden

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install "duckdb==${DUCKDB_VERSION#v}" pandas pytz

      - name: Compare with Spark
        # spark_strict also fails on LENIENT cases: SQL that Spark rejects but DuckDB accepts
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python test/run_duckdb.py -v --dialect ${{ matrix.dialect }} $(python scripts/case_group.py ${{ matrix.group }})

      - name: Compare with Spark under ANSI mode (workstream D)
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: |
          files=$(python scripts/case_group.py ${{ matrix.group }} --config ansi)
          if [ -n "$files" ]; then python test/run_duckdb.py -v --dialect ${{ matrix.dialect }} --config spark.sql.ansi.enabled=true $files; fi

      - name: DuckDB settings must not leak (plan B5)
        if: matrix.group == 'base'
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python scripts/check_duckdb_leaks.py --dialect ${{ matrix.dialect }}

      - name: Coverage report
        if: always() && matrix.dialect == 'spark' && matrix.group == 'base'
        run: |
          if [ -f test/results/functions.json ] && [ -f test/results/summary.txt ]; then
            python scripts/coverage_report.py
            cat COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dialect }}-${{ matrix.group }}
          path: |
            test/results/
            COVERAGE.md
          if-no-files-found: ignore

  fuzz-smoke:
    name: Fuzz (smoke, fixed seeds)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download the extension
        uses: actions/download-artifact@v4
        with:
          name: spark_dialect-${{ env.DUCKDB_VERSION }}-linux_amd64
          path: build

      - name: Check out DuckDB's SQL tests (for the isolation check)
        run: git clone --depth 1 --branch "$DUCKDB_VERSION" --filter=blob:none --sparse https://github.com/duckdb/duckdb.git duckdb && git -C duckdb sparse-checkout set test/sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (for Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python packages
        run: pip install "duckdb==${DUCKDB_VERSION#v}" "pyspark==$PYSPARK_VERSION" pandas pytz

      - name: Replay crash regressions
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python test/fuzz/replay.py

      - name: Check known differences are not stale
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python test/fuzz/replay.py --known

      - name: Mutation fuzzing (crashes, hangs, internal errors)
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python test/fuzz/mutate.py --seed 1 --budget 4000 --jobs 2 --out test/fuzz/out/mutate

      - name: Differential fuzzing against Spark
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python test/fuzz/differential.py --seed 1 --budget 150 --reduce-limit 5 --out test/fuzz/out/differential

      - name: Dialect isolation
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: python test/fuzz/isolation.py --duckdb-src duckdb --budget 60 --out test/fuzz/out/isolation

      - name: Summaries
        if: always()
        run: cat test/fuzz/out/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke
          path: test/fuzz/out/
          if-no-files-found: ignore

  bench-smoke:
    name: Benchmarks (smoke)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Download the extension
        uses: actions/download-artifact@v4
        with:
          name: spark_dialect-${{ env.DUCKDB_VERSION }}-linux_amd64
          path: build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install "duckdb==${DUCKDB_VERSION#v}" pandas pytz

      - name: Run the smoke benchmarks
        env:
          SPARK_EXTENSION: ${{ github.workspace }}/build/spark_dialect.duckdb_extension
        run: |
          python bench/parse_bench.py --smoke --repeat 50
          python bench/func_bench.py --smoke --rows 300000 --runs 3
          python bench/tpch_bench.py --sf 0.1 --runs 3
          python bench/tpcds_bench.py --sf 0.1 --runs 1 --queries 1,3,7,22,36,42,52,55,74,96
          python bench/workload_bench.py --rows 200000 --runs 3
          python bench/latency_bench.py --repeat 100 --loads 5

      - name: Check the catastrophic thresholds
        run: |
          python bench/report.py --check bench/baseline.json > bench/out/report.md
          cat bench/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke
          path: bench/out/*.json
          if-no-files-found: ignore
