# Spark expression (run in the `spark` dialect) vs the closest native DuckDB expression (default dialect).
#
# kind = "scalar" (default): SELECT count(v) FROM (SELECT <expr> AS v FROM <table>)
# kind = "agg":              SELECT <expr> FROM <table>
# kind = "group":            SELECT count(*) FROM (SELECT j, <expr> AS v FROM <table> GROUP BY j)
# kind = "query":            SELECT count(*) FROM (<query>)
# native = "" means there is no native equivalent: only the absolute throughput is reported.
# smoke = true marks the subset used in CI (bench-smoke).
#
# Tables (bench/func_bench.py creates them in the default dialect, 10% NULLs in every column):
#   ints(i INT, j INT 1..97, b BIGINT)   doubles(x DOUBLE, y DOUBLE)   decs(d DECIMAL(18,2), e DECIMAL(38,10))
#   strs(s short ASCII, s2, l ~200 chars, u non-ASCII, csv 'a,b;c..', sn numeric string, sd date string,
#        sts timestamp string, js JSON object)
#   dates(dt DATE, ts TIMESTAMP)   arrs(a INT[] length 0..20, sa VARCHAR[])   maps(m MAP(VARCHAR, INT))

