# Differences from Spark 3.5 that the fuzzers find and that are deliberately not fixed.
# Each entry needs a reason and an example query that still reproduces it (test/fuzz/replay.py --known checks).
# `signature` is a glob over the finding signature; the optional `sql` is a regular expression the query must contain.

[[difference]]
signature = "*"
sql = '922337203685477580[78]L|2147483647|-2147483648|32767S|-32768S|127Y|-128Y|2147483648'
reason = """BIGINT values outside the INT range passed to INT parameters (add_months, bround, left, make_dt_interval,
date_from_unix_date, ...) wrap around in Spark's non-ANSI implicit casts; DuckDB's implicit casts raise an
out-of-range error instead. Fixing it means replacing DuckDB's implicit cast rules for every function argument.
Integer overflow in the dialect's own operators (+, -, *, abs, ...) does wrap like Spark and is tested
separately (test/cases/operators.sql, fuzz_regressions.sql)."""
example = "SELECT add_months('2016-08-31', 9223372036854775807L)"

[[difference]]
signature = "*"
sql = '-0\.0D'
reason = """Spark treats -0.0 and 0.0 as different values in array_distinct / array_union / array_except and map keys;
DuckDB's list functions compare them as equal."""
example = "SELECT array_distinct(array(-0.0D, 0.0D))"

[[difference]]
signature = "mismatch|*"
sql = 'FROM VALUES \((-?\d+[YSL]|CAST\(1 AS DECIMAL\(38,0\)\))\)'
reason = """A VALUES list whose rows mix literal types (-128Y with 1, DECIMAL(38,0) with 1.8) gets DuckDB's common type
(integer literals adapt to TINYINT; DECIMAL(38,0) wins over DECIMAL(2,1)) instead of Spark's (INT; DECIMAL(38,1))."""
example = "SELECT typeof(x) FROM VALUES (-128Y), (1) AS t(x)"

[[difference]]
signature = "mismatch|*approx*|*"
reason = """approx_percentile / percentile_approx / approx_count_distinct use different approximation algorithms
(DuckDB's t-digest and HyperLogLog vs Spark's GK sketch and HLL++). The documented examples match; other inputs
can differ within the approximation error."""
example = "SELECT percentile_approx(col, array(0.5, 0.4, 0.1), 2) FROM VALUES (0), (1), (2), (10) AS tab(col)"

[[difference]]
signature = "mismatch|histogram_numeric|*"
reason = "histogram_numeric is approximate; bin boundaries depend on the merge order of the algorithm."
example = "SELECT histogram_numeric(col, 2) FROM VALUES (0), (1), (2), (10) AS tab(col)"

[[difference]]
signature = "mismatch|*"
sql = '(format_string|printf) \('
reason = """Java's formatter prints NULL arguments as "null"; DuckDB's printf returns NULL when an argument is NULL."""
example = "SELECT format_string('%s', CAST(NULL AS STRING))"

[[difference]]
signature = "mismatch|array_sort|*"
reason = """array_sort with a comparator that is not a consistent total order: the result depends on the sort algorithm
(Spark's TimSort vs the rank-based sort here, see README)."""
example = "SELECT array_sort(array(5, 6, 1), (l, r) -> CASE WHEN l < r THEN -0 WHEN l > r THEN 1 ELSE 0 END)"
