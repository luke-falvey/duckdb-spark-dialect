# Differences from Spark 3.5 that the fuzzers find and that are deliberately not fixed.
# Each entry needs a reason and an example query that still reproduces it (test/fuzz/replay.py --known checks).
# `signature` is a glob over the finding signature; the optional `sql` is a regular expression the query must contain.

[[difference]]
signature = "*"
sql = '-0\.0D'
reason = """Spark's map(-0.0, 1, 0.0, 2) keeps one key (the zeros are the same key there); DuckDB rejects the duplicate.
array_distinct / array_union / array_except / array_intersect do tell -0.0 from 0.0 like Spark."""
example = "SELECT map(-0.0D, 1, 0.0D, 2)"

[[difference]]
signature = "mismatch|*approx*|*"
reason = """approx_percentile / percentile_approx / approx_count_distinct use different approximation algorithms
(DuckDB's t-digest and HyperLogLog vs Spark's GK sketch and HLL++). The documented examples match; other inputs
can differ within the approximation error."""
example = "SELECT percentile_approx(col, array(0.5, 0.4, 0.1), 2) FROM VALUES (0), (1), (2), (10) AS tab(col)"

[[difference]]
signature = "mismatch|histogram_numeric|*"
reason = "histogram_numeric is approximate; bin boundaries depend on the merge order of the algorithm."
example = "SELECT histogram_numeric(col, 2) FROM VALUES (0), (1), (2), (10) AS tab(col)"

[[difference]]
signature = "mismatch|array_sort|*"
reason = """array_sort with a comparator that is not a consistent total order: the result depends on the sort algorithm
(Spark's TimSort vs the rank-based sort here, see README). Comparators of the recognized shapes are consistent
total orders and match."""
example = "SELECT array_sort(array(3, 1, 2, 7, 4), (l, r) -> -1)"

[[difference]]
signature = "duck_error|Out of Range Error: Date out of range*"
reason = """Date arithmetic beyond DuckDB's date range (about year 5,881,580) raises an error; Spark evaluates the comparison
differently: its int day count wraps around silently (and its optimizer may never evaluate the out-of-range side).
Where both sides are evaluated and the value is out of range, both engines raise an error."""
example = "SELECT x FROM VALUES (2147483647) AS t(x) WHERE date_from_unix_date(x) = DATE '2020-01-01' + INTERVAL 1 YEAR"

[[difference]]
signature = "duck_error|Invalid Input Error: Map keys can not be NULL*"
reason = """Spark raises NULL_MAP_KEY only when a map with a NULL key is materialized; when the optimizer removes the
map (size(map(NULL, 1)) is folded to 1) the query succeeds. DuckDB always rejects the NULL key."""
example = "SELECT size(map(CAST(NULL AS STRING), 1))"

# ---- found by the type-aware fuzzers (plan E.3 - E.5: new column types, mixed kinds, types and phases compared) ----

[[difference]]
signature = "lenient_runtime|year N is out of range"
reason = "Timestamp arithmetic past year 9999: Spark raises a run-time error, DuckDB represents the timestamp."
example = "SELECT tn + INTERVAL 90 MINUTE FROM VALUES (TIMESTAMP_NTZ '9999-12-31 23:59:59') AS t(tn)"


[[difference]]
signature = "strict_lenient|?DATATYPE_MISMATCH.BINARY_OP_DIFF_TYPES?*"
reason = """spark_strict still accepts operand type combinations that Spark's analyzer rejects (a boolean compared with a
number, a string divided by a number, ...): the generator now mixes kinds on purpose. The matrices C3 and C4 list every
pair (xfail ids types-open-c3 / types-open-c4)."""
example = "SELECT 1 <= true"

[[difference]]
signature = "mismatch|*right*|null_vs_value"
sql = '(?i)\bright\s*\('
reason = "right(x, n) over a LATERAL VIEW row without a generated row: NULL versus the empty string in the outer-joined column."
example = "SELECT right(NULL, -1) FROM VALUES (map(1, 2)) AS t(m) LATERAL VIEW explode(m) e AS mk, x"
